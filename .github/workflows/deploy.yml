name: Deploy

# Runs after CI succeeds on main (or manually), on the self-hosted runner that
# lives on the production server (wct-hrform01) as the app user `trq`, label
# `wct-training-rq`. No SSH keys or deploy secrets are needed: the server pulls
# from GitHub. See docs/DEPLOYMENT.md §8.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # Only deploy commits that passed CI from a push to this repository's main
    # (never from a fork's pull request, even one whose branch is named main).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: [self-hosted, wct-training-rq]
    environment: production
    timeout-minutes: 30
    steps:
      - name: Deploy the commit CI tested
        # The gate verifies the SHA exists on origin, checks it out in
        # /opt/wct-training-rq/repo and runs scripts/deploy.sh (build in a new
        # release, migrate, switch, health check, automatic rollback).
        run: /opt/wct-training-rq/repo/scripts/ci-deploy-gate.sh "${{ github.event.workflow_run.head_sha || github.sha }}"
