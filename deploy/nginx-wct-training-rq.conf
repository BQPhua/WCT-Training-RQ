# --- WCT Training RQ — add inside the existing `server { ... }` block for hrforms.wct.my (port 443) ---
# Rate-limit zone: put this line in the `http { ... }` block (e.g. /etc/nginx/conf.d/trq-ratelimit.conf):
#   limit_req_zone $binary_remote_addr zone=trq_auth:10m rate=60r/m;
# If hrforms.wct.my sits behind another proxy/load balancer, also set
#   set_real_ip_from <proxy-ip>; real_ip_header X-Forwarded-For;
# so the limit applies per staff member rather than per proxy.

# Only the sign-in start is rate-limited (each staff sign-in = 1 request here);
# generous enough for a 9 am rush from a shared office IP.
location = /WCT-Training-RQ/api/auth/login {
    limit_req zone=trq_auth burst=60 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:3010;
    include /etc/nginx/snippets/trq-proxy.conf;
}

location ^~ /WCT-Training-RQ/api/cron/ {
    # Only the server's own crontab may call this.
    allow 127.0.0.1;
    deny all;
    proxy_pass http://127.0.0.1:3010;
    include /etc/nginx/snippets/trq-proxy.conf;
}

location ^~ /WCT-Training-RQ/api/dev/ {
    return 404;
}

location ^~ /WCT-Training-RQ {
    client_max_body_size 12m;
    proxy_pass http://127.0.0.1:3010;   # no trailing slash: keep the /WCT-Training-RQ prefix (Next.js basePath)
    include /etc/nginx/snippets/trq-proxy.conf;
}

